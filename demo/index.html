<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>师生演示 · Mike</title><link rel="stylesheet" href="/demo/demo.css"></head><body><main><header><b>Mike</b><span><a href="/" id="exit">退出演示</a></span></header>
<h1>师生演示</h1><p class="intro">在同一演示班切换身份，体验发布、作答、订正和学情。</p>
<section class="preview" aria-label="师生演示"><div class="bar"><div class="tabs" aria-label="选择演示身份"><button id="student" aria-pressed="false">学生演示</button><button id="teacher" aria-pressed="true">教师演示</button></div><button class="guide-toggle" id="toggle" aria-expanded="true" aria-controls="guide">收起指引</button></div>
<div id="workspace" class="workspace"><div class="work"><div id="kicker"></div><h2 id="heading" tabindex="-1"></h2><div id="content"></div></div><aside class="guide" id="guide" aria-label="当前步骤指引"><small id="step"></small><h3 id="guideTitle"></h3><p id="tip"></p></aside></div></section>
<p class="foot">示例资料 · 保存在此浏览器标签页 <button id="restart" type="button">重新开始</button></p><details class="preview extra"><summary>更多任务</summary>
<div data-extra="projection"><h3>课程包 · 投影</h3><p>需求曲线向右移动，交易量上升。</p><button data-result="投影示例已播放">播放示例课件</button><span role="status"></span></div>
<div data-extra="offline"><h3>班级成绩 · 线下录分</h3><label>示例学生分数 <input type="number" min="0" max="10"></label><span role="status"></span></div>
<div data-extra="reading"><h3>教材 · 文字批注</h3><label>在替代品一节写一条批注<textarea rows="2"></textarea></label></div>
<div data-extra="mock"><h3>自主模考</h3><button data-result="已选择 Unit 2">选择 Unit 2</button><button data-result="示例试卷已就绪">预览 10 题模考</button><span role="status"></span></div>
<div data-extra="bookself"><h3>Bookself</h3><button data-result="示例书签已添加">收藏替代品一节</button><span role="status"></span></div>
<div data-extra="quest"><h3>EconQuest</h3><p>需求量变化对应什么？</p><button data-result="通关：商品自身价格变化引起沿需求曲线移动。">选沿曲线移动</button><span role="status"></span></div>
<div data-extra="mike"><h3>Mike 经济学伙伴</h3><button data-result="Substitutes（替代品）能满足相似需求。一种商品涨价时，另一种商品的需求可能增加。">了解替代品概念</button><span role="status"></span></div>
</details><div class="sr" id="status" role="status"></div></main><script src="/demo/demo.js" defer></script></body></html>
